<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自然语言新建项目 v0</title>
  <style>
    :root{
      --paper:#fff;--canvas:#e9e7e2;--surface:#f9f8f5;--ink:#202124;--muted:#696c70;
      --line:#d6d3cd;--blue:#2459c4;--blue-hover:#1748ae;--blue-soft:#edf3ff;
      --yellow:#fff3c4;--yellow-line:#d9bd64;--green:#2f7549;--red:#a53c32;
      --shadow:0 20px 64px rgba(28,32,38,.24);--radius:8px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;letter-spacing:0}
    button,select,textarea{font:inherit;letter-spacing:0}
    button{cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
    button:active{transform:translateY(1px)}
    button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(36,89,196,.2);outline-offset:2px}
    .topbar{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;min-width:198px}.wordmark{width:34px;height:34px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 18px Georgia,serif}.brand b{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px}
    .product-select{width:min(29vw,300px);min-width:205px;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;color:var(--ink)}
    .new-project{height:36px;display:inline-flex;align-items:center;gap:6px;border:1px solid #9fb3df;border-radius:8px;background:#fff;color:#244d9b;padding:0 11px;font-size:12px;font-weight:700;white-space:nowrap}.new-project:hover{border-color:var(--blue);background:var(--blue-soft)}.new-project .plus{font-size:17px;line-height:1}
    .route-state{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .spacer{flex:1}.worker{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;color:var(--muted)}
    .download{height:36px;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:0 14px;font-weight:700}.download:hover{background:var(--blue-hover)}
    .workspace{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(520px,1fr) 420px;gap:1px;background:var(--line)}
    .preview{position:relative;background:#74777c;overflow:hidden}.pane-head{height:43px;display:flex;align-items:center;padding:0 15px;background:#f6f5f2;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.pane-head strong{color:var(--ink);font-size:13px;margin-right:8px}
    .sheets{height:calc(100% - 43px);display:grid;place-items:start center;overflow:hidden;padding:22px}.sheet{width:min(86%,770px);aspect-ratio:1.414/1;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:28px}.sheet-bar{height:25px;background:#eff2f7;border:1px solid #d8dde6;margin-bottom:18px}.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sheet-cell{height:84px;border:1px solid #d8dde6;background:#fbfcfe}.sheet-line{height:9px;background:#eef0f3;margin-top:12px}.sheet-line.short{width:62%}
    .chat{background:#f8f7f4;display:flex;flex-direction:column}.chat-head{padding:15px 17px;border-bottom:1px solid var(--line);background:#fff}.chat-head h1{font-size:16px;margin:0 0 4px}.chat-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.55}.chat-body{padding:16px;overflow:auto}.welcome{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px}.welcome b{font-size:14px}.welcome p{color:var(--muted);font-size:12px;line-height:1.65;margin:7px 0 0}
    .backdrop{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:20px;background:rgba(28,31,36,.46)}.backdrop[hidden]{display:none}
    .dialog{width:min(660px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;border-radius:8px;background:var(--paper);box-shadow:var(--shadow)}
    .dialog-head{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 15px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:18px;line-height:1.35}.dialog-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6;text-wrap:pretty}.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:6px;background:transparent;color:#4f545a;font-size:23px;line-height:1}.close:hover{background:#efefec}
    .dialog-body{min-height:0;overflow:auto;padding:18px 20px 20px}.prompt-label{display:block;margin-bottom:7px;font-weight:750;font-size:13px}.prompt-help{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.55}.description{display:block;width:100%;min-height:132px;resize:vertical;border:1px solid #bfc4cc;border-radius:7px;background:#fff;padding:12px 13px;line-height:1.65;color:var(--ink)}.description:focus{border-color:var(--blue);outline:3px solid rgba(36,89,196,.1)}
    .dialog-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:#faf9f7}.primary,.secondary{min-height:38px;border-radius:7px;padding:0 13px;font-size:12px;font-weight:700}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff}.primary:hover{background:var(--blue-hover)}.primary:disabled{opacity:.48;cursor:not-allowed;transform:none}.secondary{border:1px solid #bfc4cc;background:#fff;color:var(--ink)}.secondary:hover{border-color:#8f98a4;background:#f5f6f8}.action-note{margin-right:auto;color:var(--muted);font-size:10px}
    .result-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}.result-head div{min-width:0;flex:1}.result-head h3{margin:0;font-size:15px}.result-head p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.status-badge{flex:none;border-radius:12px;background:var(--yellow);color:#765900;padding:4px 8px;font-size:10px;font-weight:800}
    .section{border-top:1px solid #eceae5;padding:14px 0}.section:first-of-type{border-top:0;padding-top:0}.section-title{display:flex;align-items:center;gap:7px;margin-bottom:9px;font-size:12px;font-weight:800}.section-count{color:var(--muted);font-size:10px;font-weight:500}.facts{display:grid;grid-template-columns:112px minmax(0,1fr);gap:7px 12px;padding:11px;border:1px solid var(--line);border-radius:7px;background:#fbfbfa;font-size:12px}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:650;overflow-wrap:anywhere}
    .step-list{display:grid;gap:7px}.step-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}.step-no{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;background:var(--blue-soft);color:#244d9b;font-size:11px;font-weight:800}.step-copy b{display:block;font-size:12px}.step-copy span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.45;text-wrap:pretty}.needs{color:#856000;background:#fff7d9;border-radius:10px;padding:3px 7px;font-size:9px;white-space:nowrap}
    .unknown-list{display:grid;gap:6px}.unknown{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:6px;background:#fff8e5;color:#654600;font-size:11px;line-height:1.5}.unknown:before{content:'?';flex:none;width:17px;height:17px;display:grid;place-items:center;border:1px solid #cfad4e;border-radius:50%;font-size:10px;font-weight:800}
    .safety{padding:10px 11px;border:1px solid #c7d7ca;border-radius:7px;background:#f2f8f3;color:#315f3d;font-size:11px;line-height:1.6}.safety b{display:block;margin-bottom:2px;color:#264e31}
    .followup{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.followup[hidden]{display:none}.followup textarea{min-height:86px}
    .blocking{padding:12px;border:1px solid var(--yellow-line);border-radius:7px;background:#fff8e3}.blocking h3{margin:0 0 5px;font-size:14px}.blocking p{margin:0;color:#6c5206;font-size:11px;line-height:1.6}.choice-list{display:grid;gap:7px;margin-top:11px}.choice{display:flex;align-items:center;gap:9px;min-height:45px;border:1px solid #c9c3af;border-radius:7px;background:#fff;padding:8px 10px;text-align:left}.choice:hover{border-color:var(--blue);background:var(--blue-soft)}.choice b{display:block;font-size:11px}.choice span{display:block;margin-top:2px;color:var(--muted);font-size:9px}.choice:before{content:'→';color:var(--blue);font-weight:800}
    .offline{padding:18px;border:1px solid #d8c7c4;border-radius:7px;background:#fff7f5;text-align:center}.offline-mark{width:38px;height:38px;margin:0 auto 10px;display:grid;place-items:center;border:1px solid #d1a7a0;border-radius:50%;color:var(--red);font-weight:800}.offline h3{margin:0 0 5px;font-size:14px}.offline p{margin:0 auto;max-width:420px;color:#79514b;font-size:11px;line-height:1.65}.offline .secondary{margin-top:13px}
    .loading{padding:32px 0;text-align:center;color:var(--muted);font-size:12px}.spinner{width:28px;height:28px;margin:0 auto 11px;border:3px solid #dce4f5;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;z-index:30;left:50%;bottom:24px;display:flex;align-items:center;gap:10px;min-width:330px;max-width:calc(100vw - 32px);padding:11px 13px;border-radius:7px;background:#23272d;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.25);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:.18s ease}.toast.show{opacity:1;transform:translate(-50%,0)}.toast-mark{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#397c50;font-weight:800}.toast b{display:block;font-size:12px}.toast span{display:block;margin-top:2px;color:#d8dce1;font-size:10px}
    .tweaks-toggle{position:fixed;z-index:40;right:14px;bottom:14px;width:36px;height:36px;border:1px solid #bec3ca;border-radius:7px;background:#fff;color:#59606a;box-shadow:0 5px 16px rgba(0,0,0,.14);font-size:13px}.tweaks{position:fixed;z-index:39;right:14px;bottom:58px;width:220px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.16)}.tweaks[hidden]{display:none}.tweaks b{display:block;margin-bottom:8px;font-size:11px}.tweaks label{display:block;margin-bottom:5px;color:var(--muted);font-size:9px}.tweaks select{width:100%;height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 8px;font-size:11px}
    @media(max-width:980px){body{overflow:auto}.topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 12px}.brand{min-width:0;margin-right:auto}.product-select{order:3;width:calc(100% - 128px);min-width:0}.new-project{order:4}.route-state,.worker,.download{display:none}.workspace{height:auto;min-height:calc(100vh - 118px);grid-template-columns:1fr}.preview{min-height:430px}.chat{min-height:350px}.dialog{max-height:calc(100vh - 20px)}.backdrop{padding:10px}.dialog-head,.dialog-body{padding-left:15px;padding-right:15px}.dialog-actions{padding:10px 15px;flex-wrap:wrap}.action-note{width:100%;margin:0}.facts{grid-template-columns:92px 1fr}.step-row{grid-template-columns:32px minmax(0,1fr)}.needs{grid-column:2}.secondary,.primary{min-height:44px}.new-project{min-height:44px;height:44px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="wordmark">W</div><div><b>SOP DOCX 校样台</b><small>对话修改 · 自动出稿</small></div></div>
    <select id="product" class="product-select" aria-label="选择产品"><option>HDMI-DRAFT-001 · HDMI 成品线</option></select>
    <button id="openProject" class="new-project" type="button"><span class="plus" aria-hidden="true">＋</span>新建项目</button>
    <div class="route-state"><i class="dot"></i><span>draft · v1 · 17 道工序</span></div>
    <div class="spacer"></div><input class="worker" value="现场审核员" aria-label="工作人员"><button class="download" type="button">下载 DOCX</button>
  </header>
  <main class="workspace">
    <section class="preview"><div class="pane-head"><strong>DOCX 实时预览</strong><span>HDMI-DRAFT-001 · v1</span></div><div class="sheets"><div class="sheet"><div class="sheet-bar"></div><div class="sheet-grid"><div class="sheet-cell"></div><div class="sheet-cell"></div><div class="sheet-cell"></div><div class="sheet-cell"></div><div class="sheet-cell"></div><div class="sheet-cell"></div></div><div class="sheet-line"></div><div class="sheet-line short"></div></div></div></section>
    <aside class="chat"><div class="chat-head"><h1>直接告诉 AI 哪里要改</h1><p>不需要找字段。AI 会定位内容，写入草稿并重新生成 DOCX。</p></div><div class="chat-body"><div class="welcome"><b>已有项目在这里继续修改</b><p>要从头建立另一个产品，请点上方“新建项目”，直接说这个产品是怎么做的。</p></div></div></aside>
  </main>

  <div id="backdrop" class="backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-head"><div><h2 id="dialogTitle">新建项目草稿</h2><p id="dialogSubtitle">先把你知道的说出来，AI 会帮你整理成工序，没说清楚的地方会单独列出来。</p></div><button id="closeDialog" class="close" type="button" aria-label="关闭">×</button></div>
      <div id="dialogBody" class="dialog-body"></div>
      <div id="dialogActions" class="dialog-actions"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status"><div class="toast-mark">✓</div><div><b>项目草稿已创建</b><span>已切换到“USB-C 转接线”，全部工序等待人工核对。</span></div></div>
  <button id="tweaksToggle" class="tweaks-toggle" type="button" title="切换预览状态">T</button>
  <div id="tweaks" class="tweaks" hidden><b>Tweaks</b><label for="scenario">整理结果场景</label><select id="scenario"><option value="normal">正常整理</option><option value="incomplete">信息不足</option><option value="duplicate">同名项目</option><option value="offline">AI 不可用</option></select></div>

  <script>
    const $=id=>document.getElementById(id);
    let stage='input',scenario='normal',followupOpen=false;
    const originalText='这个项目是 USB-C 转接线。先检查来料，然后裁线和剥皮，接着焊接端子，最后做通电检查和包装。焊接后要看有没有虚焊，其他参数我不清楚。';
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function inputView(){return `<label class="prompt-label" for="description">描述一下这个产品怎么做</label><textarea id="description" class="description" placeholder="例如：这是一个 USB-C 转接线项目。先检查来料，然后裁线、剥皮、焊接端子，最后做通电检查和包装……">${esc(originalText)}</textarea><span class="prompt-help">顺序不完整也没关系，先说你知道的。设备型号、参数和合格标准不知道就不用猜。</span>`}
    const steps=[['检查来料','核对物料和外观'],['裁线','按要求准备线材'],['剥皮','去除指定位置外皮'],['焊接端子','完成端子焊接并检查虚焊'],['通电检查','检查通电情况'],['包装','完成成品包装']];
    function normalResult(incomplete=false){const visible=incomplete?steps.slice(0,3):steps;const unknowns=incomplete?['产品名称或型号还没有说清楚','后续检验和包装步骤还没有提供','各工序的检查方法和合格标准需要补充']:['裁线长度和剥皮尺寸待工艺人员补充','焊接设备、温度等参数待工艺人员确认','通电检查的合格标准待质量人员确认','包装材料和标签要求待补充'];return `<div class="result-head"><div><h3>${incomplete?'还需要补充一些关键信息':'AI 已整理出项目草稿'}</h3><p>${incomplete?'现有内容可以先保留，补充后再重新整理，不会重复创建项目。':'请先核对工序顺序。确认创建后，所有内容仍会标记为待人工核对。'}</p></div><span class="status-badge">草稿 · 待核对</span></div><section class="section"><div class="section-title">产品信息</div><dl class="facts"><dt>产品名称</dt><dd>${incomplete?'待补充':'USB-C 转接线'}</dd><dt>项目编号</dt><dd>创建时生成临时编号</dd><dt>路线名称</dt><dd>${incomplete?'新项目工艺路线':'USB-C 转接线工艺路线'}</dd></dl></section><section class="section"><div class="section-title">工序顺序 <span class="section-count">共 ${visible.length} 道</span></div><div class="step-list">${visible.map((step,index)=>`<div class="step-row"><span class="step-no">${index+1}</span><div class="step-copy"><b>${esc(step[0])}</b><span>${esc(step[1])}</span></div><span class="needs">待人工核对</span></div>`).join('')}</div></section><section class="section"><div class="section-title">还需要补充 <span class="section-count">不会自动猜</span></div><div class="unknown-list">${unknowns.map(item=>`<div class="unknown">${esc(item)}</div>`).join('')}</div></section><div class="safety"><b>这次没有自动填写</b>设备型号、具体参数、工时、人数和质量结论都保持空白，等现场人员确认后再补。</div><div id="followup" class="followup" ${followupOpen?'':'hidden'}><label class="prompt-label" for="followupText">继续补充</label><textarea id="followupText" class="description" placeholder="例如：裁线长度按工单要求，包装前还要检查标签……"></textarea><span class="prompt-help">补充内容会和刚才的描述一起重新整理。</span></div>`}
    function duplicateResult(){return `<div class="blocking"><h3>发现一个同名项目</h3><p>系统里已经有“USB-C 转接线”。为避免覆盖原来的资料，请先选择你要怎么处理。</p><div class="choice-list"><button class="choice" type="button"><span><b>这是另一个型号</b><span>补充型号或产品编号后，作为新项目创建</span></span></button><button class="choice" type="button"><span><b>复制现有项目</b><span>保留来源记录，复制后再修改工序</span></span></button><button class="choice" type="button"><span><b>修改现有项目</b><span>如果原路线已批准，将创建新的修订版</span></span></button></div></div>`}
    function offlineResult(){return `<div class="offline"><div class="offline-mark">!</div><h3>AI 暂时没有连接上</h3><p>这次没有生成工序，也没有写入任何项目。完整路线不能靠离线规则猜测，请检查 AI 服务后重试。</p><button id="retry" class="secondary" type="button">重新检查连接</button></div>`}
    function loadingView(){return '<div class="loading"><div class="spinner"></div>AI 正在整理产品和工序，不会直接创建项目……</div>'}
    function render(){const body=$('dialogBody'),actions=$('dialogActions');$('dialogTitle').textContent=stage==='input'?'新建项目草稿':'核对 AI 整理结果';$('dialogSubtitle').textContent=stage==='input'?'先把你知道的说出来，AI 会帮你整理成工序，没说清楚的地方会单独列出来。':'确认后才会创建项目，并生成第一版 DOCX 草稿。';if(stage==='input'){body.innerHTML=inputView();actions.innerHTML='<span class="action-note">此时不会写入数据库</span><button id="cancel" class="secondary" type="button">取消</button><button id="organize" class="primary" type="button">让 AI 整理</button>'}else if(stage==='loading'){body.innerHTML=loadingView();actions.innerHTML='<span class="action-note">正在等待 AI 返回</span><button class="primary" type="button" disabled>正在整理</button>'}else{if(scenario==='duplicate')body.innerHTML=duplicateResult();else if(scenario==='offline')body.innerHTML=offlineResult();else body.innerHTML=normalResult(scenario==='incomplete');const blocked=['duplicate','offline'].includes(scenario);actions.innerHTML=`<span class="action-note">${blocked?'尚未创建项目':'创建后仍可继续增删和调整工序'}</span><button id="back" class="secondary" type="button">返回修改</button>${blocked?'':`<button id="continue" class="secondary" type="button">${followupOpen?'重新整理':'继续补充'}</button><button id="create" class="primary" type="button" ${scenario==='incomplete'?'disabled title="请先补充关键信息"':''}>创建项目草稿</button>`}`}
      $('cancel')?.addEventListener('click',close);$('organize')?.addEventListener('click',organize);$('back')?.addEventListener('click',()=>{stage='input';followupOpen=false;render()});$('continue')?.addEventListener('click',()=>{if(!followupOpen){followupOpen=true;render();setTimeout(()=>$('followupText')?.focus(),0)}else organize()});$('create')?.addEventListener('click',createProject);$('retry')?.addEventListener('click',()=>{scenario='normal';$('scenario').value='normal';organize()})}
    function open(){stage='input';followupOpen=false;$('backdrop').hidden=false;render();setTimeout(()=>$('description')?.focus(),0)}
    function close(){$('backdrop').hidden=true}
    function organize(){stage='loading';render();setTimeout(()=>{stage='result';render()},650)}
    function createProject(){$('product').insertAdjacentHTML('beforeend','<option selected>USB-C-DRAFT · USB-C 转接线</option>');close();$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3500)}
    $('openProject').addEventListener('click',open);$('closeDialog').addEventListener('click',close);$('backdrop').addEventListener('click',event=>{if(event.target===$('backdrop'))close()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('backdrop').hidden)close()});$('scenario').addEventListener('change',event=>{scenario=event.target.value;if(stage==='result')render()});$('tweaksToggle').addEventListener('click',()=>{$('tweaks').hidden=!$('tweaks').hidden});
    const previewParams=new URLSearchParams(location.search),previewScenario=previewParams.get('scenario');
    if(['normal','incomplete','duplicate','offline'].includes(previewScenario)){scenario=previewScenario;$('scenario').value=scenario}
    if(previewParams.get('stage')==='result'){stage='result';$('backdrop').hidden=false;render()}else open();
  </script>
</body>
</html>
