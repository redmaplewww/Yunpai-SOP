<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>工序图片编排 - 交互原型</title>
  <style>
    :root{--paper:#fff;--canvas:#eef0f2;--ink:#1f252b;--muted:#69727c;--line:#d3d9df;--blue:#2459c4;--blue-soft:#edf3ff;--green:#277243;--green-soft:#eaf6ed;--amber:#9a6710;--amber-soft:#fff4d5;--red:#a43d34;--red-soft:#fff0ee;--shadow:0 14px 34px rgba(32,42,53,.11);--radius:8px}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}.topbar{height:62px;display:flex;align-items:center;gap:15px;padding:0 20px;background:#fafaf8;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;min-width:214px}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;background:var(--blue);color:white;font-family:Georgia,serif;font-weight:800}.brand b{display:block;font-size:14px}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.route-select{height:36px;min-width:246px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 10px;color:var(--ink)}.route-state{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.route-state:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber)}.spacer{flex:1}.prototype-tag{border:1px solid #d5b66d;border-radius:999px;background:#fff8df;color:#785207;padding:5px 9px;font-size:10px;font-weight:700}.top-action{height:36px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 12px;color:#34404d;font-size:12px;font-weight:700}.workspace{height:calc(100vh - 62px);display:grid;grid-template-columns:278px minmax(560px,1fr) 316px;gap:1px;background:var(--line);overflow:hidden}.panel{min-width:0;min-height:0;background:#f8f9fa;display:flex;flex-direction:column}.panel-head{display:flex;align-items:center;gap:8px;min-height:60px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff}.panel-head h1{margin:0;font-size:14px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:10px}.panel-count{margin-left:auto;border:1px solid #cbd8f1;border-radius:999px;background:var(--blue-soft);padding:3px 7px;color:#264e9c;font-size:10px;font-weight:750}.asset-toolbar{display:flex;gap:7px;padding:10px 12px;border-bottom:1px solid v 0}.process-node.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(36,89,196,.16),0 4px 12px rgba(34,43,52,.07)}.process-node.drop-target{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 3px rgba(36,89,196,.2);transform:translateY(-2px)}.process-head{padding:10px 10px 8px;border-bottom:1px solid #e7eaed}.process-code{color:#315aa8;font-size:9px;font-weight:800}.process-title{display:block;margin-top:4px;font-size:12px;font-weight:750;line-height:1.35}.process-state{display:inline-flex;align-items:center;gap:4px;margin-top:7px;color:var(--amber);font-size:9px}.process-state:before{content:"";width:6px;height:6px;border-radius:50%;background:#c98a1b}.image-drop{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;min-height:137px;padding:9px;border-bottom:1px solid #e7eaed;background:#fbfcfd}.image-drop.empty{display:grid;place-items:center;align-content:center;color:#82909d;font-size:10px;text-align:center;line-height:1.55}.image-drop.empty:before{content:"图片区";display:block;color:#55636f;font-size:10px;font-weight:750}.binding-card{position:relative;width:calc(50% - 3px);aspect-ratio:1.18/1;border:1px solid #cfd6dd;border-radius:5px;background:#fff;overflow:hidden}.binding-card:hover{border-color:var(--blue)}.binding-card.drop-replace{border-color:var(--blue);box-shadow:0 0 0 2px rgba(36,89,196,.18)}.binding-card .binding-preview{width:100%;height:100%}.binding-status{position:absolute;right:4px;bottom:4px;border-radius:999px;background:var(--amber-soft);color:#805607;padding:2px 4px;font-size:8px;font-weight:750}.binding-card.confirmed .binding-status{background:var(--green-soft);color:#286d40}.binding-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border:0;border-radius:4px;background:rgba(255,255,255,.94);color:#7a3130;font-size:16px;line-height:1;opacity:0}.binding-card:hover .binding-remove{opacity:1}.process-foot{display:flex;align-items:center;padding:8px 10px;color:var(--muted);font-size:9px}.process-foot span:last-child{margin-left:auto}.inspector{background:#f8f9fa}.inspector-name{min-width:0}.inspector-name b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.inspector-name span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.inspector-body{flex:1;min-height:0;overflow:auto;padding:12px}.status-banner{display:flex;align-items:center;gap:8px;margin-bottom:12px;border:1px solid #e0c681;border-radius:7px;background:#fff8e6;padding:9px;color:#76510a;font-size:10px;line-height:1.5}.status-banner:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#c4891a}.bound-list{display:grid;gap:8px}.bound-row{display:grid;grid-template-columns:68px minmax(0,1fr);gap:9px;min-height:76px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px}.bound-row .binding-preview{width:68px;height:62px}.bound-copy{min-width:0;padding-top:1px}.bound-copy b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bound-copy span{display:block;margin-top:4px;color:var(--muted);font-size:9px}.bound-actions{display:flex;align-items:center;gap:5px;margin-top:7px}.mini{min-height:25px;border:1px solid #bfc8d1;border-radius:5px;background:#fff;padding:0 7px;color:#3d4b58;font-size:9px;font-weight:700}.mini.confirm{border-color:#8fbd9d;background:#f5fbf6;color:#286d40}.mini.unlink{color:#963a33}.empty-state{padding:24px 10px;color:var(--muted);font-size:11px;text-align:center}.inspector-foot{flex:none;border-top:1px solid var(--line);padding:10px 12px;background:#fff}.inspector-foot b{display:block;font-size:10px}.inspector-foot span{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.5}.toast{position:fixed;z-index:20;left:50%;bottom:22px;display:flex;align-items:center;gap:10px;max-width:min(510px,calc(100vw - 30px));border:1px solid #bdc9d7;border-radius:8px;background:#fff;padding:10px 11px;box-shadow:var(--shadow);color:#34404d;font-size:11px;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:.18s ease}.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}.toast button{min-height:28px;border:1px solid #9fb2d8;border-radius:5px;background:#f5f8ff;color:#234b97;padding:0 8px;font-size:10px;font-weight:750}.toast b{color:#244d9b}.drop-caption{position:absolute;z-index:15;display:none;pointer-events:none;border-radius:6px;background:#244d9b;color:#fff;padding:6px 8px;font-size:10px;font-weight:700;box-shadow:0 4px 12px rgba(20,47,100,.2)}.drop-caption.show{display:block}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1040px){.workspace{grid-template-columns:246px minmax(510px,1fr)}.inspector{position:fixed;z-index:10;right:12px;bottom:12px;width:300px;max-height:64vh;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.inspector .panel-head{min-height:52px}.inspector-foot{display:none}}@media(max-width:760px){body{overflow:auto}.topbar{height:auto;min-height:62px;flex-wrap:wrap;padding:10px 12px}.brand{min-width:0;flex:1}.route-select{order:3;min-width:100%;width:100%}.route-state,.prototype-tag{display:none}.workspace{height:auto;min-height:calc(100vh - 120px);grid-template-columns:1fr;overflow:visible}.panel:first-child{min-height:302px}.flow-panel{min-height:540px}.asset-list{max-height:230px;grid-template-columns:repeat(2,minmax(0,1fr))}.asset-card{grid-template-columns:48px minmax(0,1fr);min-height:62px}.asset-preview{width:48px;height:48px}.asset-copy span,.asset-usage{display:none}.inspector{width:calc(100vw - 24px)}.flow-body{padding:12px}.flow-canvas{padding:16px;min-width:710px}}
    @media(min-width:1041px){.flow-canvas{min-width:0}.process-node{width:168px}.process-wrap{gap:8px}.process-wrap:not(:last-child):after{width:16px}.process-wrap:not(:last-child):before{right:14px}}

<body>
  <!-- PROTOTYPE ONLY: image binding state is held in memory and never reaches a route, DOCX, or API. -->
  <header class="topbar">
    <div class="brand"><div class="mark">W</div><div><b>SOP 工序图片编排</b><span>交互原型 · 不写入真实路线</span></div></div>
    <button class="route-select" type="button">HDMI-DRAFT-001 · HDMI 成品线</button>
    <span class="route-state">草稿待核对</span><span class="spacer"></span><span class="prototype-tag">PROTOTYPE</span><button class="top-action" type="button" id="resetDemo">重置演示</button>
  </header>
  <main class="workspace">
    <aside class="panel" aria-label="路线素材库">
      <div class="panel-head"><div><h1>路线素材</h1><p>当前路线内的图片文件</p></div><span class="panel-count" id="assetCount">0 张</span></div>
      <div class="asset-toolbar"><label class="visually-hidden" for="assetSearch">搜索图片</label><input class="search" id="assetSearch" placeholder="搜索图片名称"><label class="add-asset" title="添加图片" aria-label="添加图片">＋<input id="assetUpload" class="visually-hidden" type="file" accept="image/png,image/jpeg" multiple></label></div>
      <div class="asset-list" id="assetList"></div>
      <div class="asset-note">图片文件与工序绑定分开保存。解除绑定不会删除原图。</div>
    </aside>
    <section class="flow-panel" aria-label="完整工序图">
      <div class="flow-head"><div><h2>完整工序图</h2><p>图片随工序绑定，DOCX 仅使用已确认图片。</p></div><span class="flow-summary" id="flowSummary"></span></div>
      <div class="flow-body"><div class="flow-canvas"><div class="flow-rail" id="flowRail"></div></div></div>
    </section>
    <aside class="panel inspector" aria-label="当前工序图片">
      <div class="panel-head"><div class="inspector-name"><b id="inspectorTitle">选择工序</b><span id="inspectorSubtitle">当前工序图片</span></div><span class="panel-count" id="bindingCount">0 / 6</span></div>
      <div class="inspector-body"><div class="status-banner">新绑定和替换后的图片需要逐张人工确认。</div><div class="bound-list" id="boundList"></div></div>
      <div class="inspector-foot"><b>DOCX 图片版式</b><span>按当前顺序动态排版；单工序最多使用 6 张已确认图片。</span></div>
    </aside>
  </main>
  <div class="drop-caption" id="dropCaption">释放后绑定到此工序</div>
  <div class="toast" id="toast"><span id="toastText"></span><button id="undoButton" type="button" hidden>撤销</button></div>
  <script>
    const initialAssets=[
      {id:1,name:'裁线-长度确认.jpg',art:'wire',used:1},{id:2,name:'端子压接-定位.jpg',art:'connector',used:0},{id:3,name:'导通测试-仪表.jpg',art:'tester',used:1},{id:4,name:'包装-标签核对.jpg',art:'pack',used:0},{id:5,name:'外观检验-成品.jpg',art:'wire',used:0}
    ];
    const initialSteps=[
      {id:101,code:'OP-01',title:'裁线与长度补偿',bindings:[{id:1,assetId:1,state:'confirmed'}]},
      {id:102,code:'OP-02',title:'端子压接',bindings:[]},
      {id:103,code:'OP-03',title:'导通与耐压测试',bindings:[{id:2,assetId:3,state:'draft'}]},
      {id:104,code:'OP-04',title:'外观检验与包装',bindings:[]}
    ];
    let assets=[],steps=[],activeStepId=101,selectedAssetId=null,dragPayload=null,lastUndo=null,toastTimer=null,nextAssetId=6,nextBindingId=3;
    const $=id=>document.getElementById(id);
    const clone=value=>JSON.parse(JSON.stringify(value));
    const activeStep=()=>steps.find(step=>step.id===activeStepId);
    const assetFor=id=>assets.find(asset=>asset.id===id);
    const usageFor=id=>steps.reduce((count,step)=>count+step.bindings.filter(binding=>binding.assetId===id).length,0);
    function art(asset,extra=''){return asset.url?`<img src="${asset.url}" alt="${asset.name}" style="width:100%;height:100%;object-fit:cover">`:`<span class="art ${asset.art} ${extra}"></span>`}
    function start(){assets=clone(initialAssets);steps=clone(initialSteps);activeStepId=101;selectedAssetId=null;lastUndo=null;nextAssetId=6;nextBindingId=3;renderAll()}
    function renderAll(){renderAssets();renderFlow();renderInspector()}
    function renderAssets(){const query=$('assetSearch').value.trim().toLowerCase(),visible=assets.filter(asset=>asset.name.toLowerCase().includes(query));$('assetCount').textContent=`${assets.length} 张`;$('assetList').innerHTML=visible.map(asset=>`<article class="asset-card ${selectedAssetId===asset.id?'selected':''}" draggable="true" data-asset-id="${asset.id}" title="${asset.name}"><div class="asset-preview">${art(asset)}</div><div class="asset-copy"><b>${asset.name}</b><span>${asset.url?'本次演示上传':'路线素材'}</span><span class="asset-usage">${usageFor(asset.id)?`已绑定 ${usageFor(asset.id)} 处`:'未绑定'}</span></div></article>`).join('')||'<div class="empty-state">没有符合条件的图片</div>';$('assetList').querySelectorAll('.asset-card').forEach(card=>{const assetId=Number(card.dataset.assetId);card.addEventListener('click',()=>{selectedAssetId=selectedAssetId===assetId?null:assetId;renderAssets();renderFlow()});card.addEventListener('dragstart',event=>{dragPayload={kind:'asset',assetId};card.classList.add('dragging');event.dataTransfer.effectAllowed='copy';event.dataTransfer.setData('text/plain',String(assetId))});card.addEventListener('dragend',()=>{dragPayload=null;card.classList.remove('dragging');clearDropState()})})}
    function renderFlow(){const total=steps.reduce((count,step)=>count+step.bindings.length,0),confirmed=steps.reduce((count,step)=>count+step.bindings.filter(binding=>binding.state==='confirmed').length,0);$('flowSummary').textContent=`${total} 张已绑定 · ${confirmed} 张已确认`;$('flowRail').innerHTML=steps.map((step,index)=>{const isActive=step.id===activeStepId,images=step.bindings.map(binding=>{const asset=assetFor(binding.assetId);return `<div class="binding-card ${binding.state==='confirmed'?'confirmed':''}" draggable="true" data-binding-id="${binding.id}" data-step-id="${step.id}" title="${asset.name}"><div class="binding-preview">${art(asset)}</div><span class="binding-status">${binding.state==='confirmed'?'已确认':'待确认'}</span><button class="binding-remove" type="button" data-remove-binding="${binding.id}" aria-label="解除 ${asset.name} 绑定">×</button></div>`}).join('');return `<div class="process-wrap"><article class="process-node ${isActive?'active':''}" data-step-id="${step.id}"><div class="process-head"><span class="process-code">${String(index+1).padStart(2,'0')} · ${step.code}</span><span class="process-title">${step.title}</span><span class="process-state">${step.bindings.filter(binding=>binding.state==='draft').length?'含待确认图片':'图片已核对'}</span></div><div class="image-drop ${step.bindings.length?'':'empty'}" data-drop-step="${step.id}">${images||'<span>拖入图片</span>'}</div><div class="process-foot"><span>${step.bindings.length}/6 张图片</span><span>${isActive?'当前工序':''}</span></div></article></div>`}).join('');$('flowRail').querySelectorAll('.process-node').forEach(node=>{const stepId=Number(node.dataset.stepId);node.addEventListener('click',event=>{if(event.target.closest('.binding-remove'))return;activeStepId=stepId;renderFlow();renderInspector()});node.addEventListener('dragover',event=>{if(dragPayload||event.dataTransfer.files.length){event.preventDefault();node.classList.add('drop-target');showDropCaption(event,'释放后绑定到此工序')}});node.addEventListener('dragleave',event=>{if(!node.contains(event.relatedTarget)){node.classList.remove('drop-target');hideDropCaption()}});node.addEventListener('drop',event=>{event.preventDefault();node.classList.remove('drop-target');hideDropCaption();handleStepDrop(stepId,event)});node.querySelectorAll('.binding-card').forEach(card=>{const bindingId=Number(card.dataset.bindingId);card.addEventListener('dragstart',event=>{event.stopPropagation();dragPayload={kind:'binding',bindingId,fromStepId:stepId};event.dataTransfer.effectAllowed='copy';event.dataTransfer.setData('text/plain',`binding-${bindingId}`)});card.addEventListener('dragover',event=>{if(dragPayload?.kind==='asset'){event.preventDefault();event.stopPropagation();card.classList.add('drop-replace');showDropCaption(event,'释放后替换这张图片')}});card.addEventListener('dragleave',()=>{card.classList.remove('drop-replace');hideDropCaption()});card.addEventListener('drop',event=>{if(dragPayload?.kind!=='asset')return;event.preventDefault();event.stopPropagation();card.classList.remove('drop-replace');hideDropCaption();replaceBinding(stepId,bindingId,dragPayload.assetId)});card.addEventListener('dragend',()=>{dragPayload=null;clearDropState()})});node.querySelectorAll('[data-remove-binding]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();unlinkBinding(stepId,Number(button.dataset.removeBinding))}))})}
    function renderInspector(){const step=activeStep();$('inspectorTitle').textContent=step?`${step.code} · ${step.title}`:'选择工序';$('inspectorSubtitle').textContent=step?'当前工序图片':'请选择一张工序卡';$('bindingCount').textContent=step?`${step.bindings.length} / 6`:'0 / 6';if(!step){$('boundList').innerHTML='<div class="empty-state">尚未选择工序</div>';return}$('boundList').innerHTML=step.bindings.length?step.bindings.map((binding,index)=>{const asset=assetFor(binding.assetId);return `<article class="bound-row"><div class="binding-preview">${art(asset)}</div><div class="bound-copy"><b>${index+1}. ${asset.name}</b><span>${binding.state==='confirmed'?'已人工确认':'待人工确认'}</span><div class="bound-actions">${binding.state==='draft'?`<button class="mini confirm" type="button" data-confirm="${binding.id}">确认</button>`:''}<button class="mini unlink" type="button" data-unlink="${binding.id}">解绑</button></div></div></article>`}).join(''):'<div class="empty-state">当前工序尚未绑定图片</div>';$('boundList').querySelectorAll('[data-confirm]').forEach(button=>button.addEventListener('click',()=>confirmBinding(step.id,Number(button.dataset.confirm))));$('boundList').querySelectorAll('[data-unlink]').forEach(button=>button.addEventListener('click',()=>unlinkBinding(step.id,Number(button.dataset.unlink))))}
    function handleStepDrop(stepId,event){if(event.dataTransfer.files.length){[...event.dataTransfer.files].filter(file=>/^image\/(png|jpeg)$/.test(file.type)).forEach(file=>{const asset={id:nextAssetId++,name:file.name,url:URL.createObjectURL(file),art:'',used:0};assets.push(asset);bindAsset(stepId,asset.id)});return}if(!dragPayload)return;if(dragPayload.kind==='asset')bindAsset(stepId,dragPayload.assetId);if(dragPayload.kind==='binding'){const source=steps.find(step=>step.id===dragPayload.fromStepId)?.bindings.find(binding=>binding.id===dragPayload.bindingId);if(source)bindAsset(stepId,source.assetId,true)}}
    function bindAsset(stepId,assetId,fromCopy=false){const step=steps.find(item=>item.id===stepId),asset=assetFor(assetId);if(!step||!asset)return;if(step.bindings.length>=6){showToast('该工序已达到 6 张图片上限');return}if(step.bindings.some(binding=>binding.assetId===assetId)){showToast('这张图片已经绑定到该工序');return}step.bindings.push({id:nextBindingId++,assetId,state:'draft'});activeStepId=stepId;selectedAssetId=null;showToast(fromCopy?`已复制“${asset.name}”到 ${step.title}`:`已绑定“${asset.name}”到 ${step.title}`);renderAll()}
    function replaceBinding(stepId,bindingId,assetId){const step=steps.find(item=>item.id===stepId),binding=step?.bindings.find(item=>item.id===bindingId),asset=assetFor(assetId);if(!binding||!asset)return;if(step.bindings.some(item=>item.id!==bindingId&&item.assetId===assetId)){showToast('这张图片已经在当前工序中');return}const previous=assetFor(binding.assetId);binding.assetId=assetId;binding.state='draft';selectedAssetId=null;showToast(`已替换“${previous.name}”，新图片待确认`);renderAll()}
    function confirmBinding(stepId,bindingId){const binding=steps.find(step=>step.id===stepId)?.bindings.find(item=>item.id===bindingId);if(!binding)return;binding.state='confirmed';showToast('图片已确认，可进入下一次 DOCX 生成');renderAll()}
    function unlinkBinding(stepId,bindingId){const step=steps.find(item=>item.id===stepId),index=step?.bindings.findIndex(item=>item.id===bindingId);if(index===undefined||index<0)return;const [removed]=step.bindings.splice(index,1);lastUndo={stepId,index,binding:removed};showToast(`已解除“${assetFor(removed.assetId).name}”的工序绑定`,true);renderAll()}
    function showToast(text,allowUndo=false){clearTimeout(toastTimer);$('toastText').textContent=text;$('undoButton').hidden=!allowUndo;$('toast').classList.add('show');toastTimer=setTimeout(()=>{$('toast').classList.remove('show');lastUndo=null},7000)}
    function showDropCaption(event,text){$('dropCaption').textContent=text;$('dropCaption').style.left=`${Math.min(window.innerWidth-190,event.clientX+12)}px`;$('dropCaption').style.top=`${Math.max(8,event.clientY-34)}px`;$('dropCaption').classList.add('show')}
    function hideDropCaption(){$('dropCaption').classList.remove('show')}
    function clearDropState(){document.querySelectorAll('.drop-target,.drop-replace').forEach(item=>item.classList.remove('drop-target','drop-replace'));hideDropCaption()}
    $('assetSearch').addEventListener('input',renderAssets);$('assetUpload').addEventListener('change',event=>{[...event.target.files].filter(file=>/^image\/(png|jpeg)$/.test(file.type)).forEach(file=>assets.push({id:nextAssetId++,name:file.name,url:URL.createObjectURL(file),art:'',used:0}));event.target.value='';renderAssets();showToast('图片已加入路线素材库')});$('undoButton').addEventListener('click',()=>{if(!lastUndo)return;const step=steps.find(item=>item.id===lastUndo.stepId);step.bindings.splice(lastUndo.index,0,lastUndo.binding);lastUndo=null;$('toast').classList.remove('show');renderAll()});$('resetDemo').addEventListener('click',start);start();
    function reorderBinding(stepId,sourceBindingId,targetBindingId){if(sourceBindingId===targetBindingId)return;const step=steps.find(item=>item.id===stepId),from=step?.bindings.findIndex(item=>item.id===sourceBindingId),to=step?.bindings.findIndex(item=>item.id===targetBindingId);if(from===undefined||to===undefined||from<0||to<0)return;const [binding]=step.bindings.splice(from,1);step.bindings.splice(to,0,binding);showToast('已调整当前工序的图片顺序');renderAll()}
    $('flowRail').addEventListener('click',event=>{if(!selectedAssetId||event.target.closest('.binding-card'))return;const node=event.target.closest('.process-node');if(node)bindAsset(Number(node.dataset.stepId),selectedAssetId)});
    $('flowRail').addEventListener('dragover',event=>{const card=event.target.closest('.binding-card');if(!card||dragPayload?.kind!=='binding'||Number(card.dataset.bindingId)===dragPayload.bindingId||Number(card.dataset.stepId)!==dragPayload.fromStepId)return;event.preventDefault();event.stopPropagation();card.classList.add('drop-replace');showDropCaption(event,'释放后调整图片顺序')},true);
    $('flowRail').addEventListener('drop',event=>{const card=event.target.closest('.binding-card');if(!card||dragPayload?.kind!=='binding'||Number(card.dataset.bindingId)===dragPayload.bindingId||Number(card.dataset.stepId)!==dragPayload.fromStepId)return;event.preventDefault();event.stopPropagation();card.classList.remove('drop-replace');hideDropCaption();reorderBinding(Number(card.dataset.stepId),dragPayload.bindingId,Number(card.dataset.bindingId));dragPayload=null},true);
  </script>
