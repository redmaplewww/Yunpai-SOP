[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yunpai-sop"
version = "0.1.0"
description = "Route-backed SOP knowledge, human review, and DOCX generation workbench."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "pillow>=10.0,<12.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0"
]

[project.scripts]
yunpai-sop = "cad_ai.sop_knowledge.web:main"

[tool.setuptools.packages.find]
include = ["cad_ai*"]

