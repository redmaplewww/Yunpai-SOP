<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SOP 项目图片统一调整</title>
  <style>
    :root{--page:#edf1f5;--surface:#fff;--ink:#172534;--muted:#677586;--line:#d4dce5;--blue:#1d5ec8;--blue-soft:#eaf2ff;--amber:#a36300;--amber-soft:#fff6df;--green:#18724e;--green-soft:#e8f5ee;--red:#ad3c39;--red-soft:#fff0ef;--shadow:0 8px 22px rgba(31,51,72,.09)}
    *{box-sizing:border-box}html{background:var(--page)}body{min-width:320px;margin:0;background:var(--page);color:var(--ink);font:14px/1.5 "Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}:focus-visible{outline:3px solid rgba(29,94,200,.28);outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .topbar{height:60px;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;min-width:195px}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;background:var(--blue);color:#fff;font-weight:800}.brand-copy b{display:block;font-size:14px}.brand-copy small{display:block;color:var(--muted);font-size:10px}.route-select{min-width:245px;max-width:360px;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.top-status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.top-status i{width:8px;height:8px;border-radius:50%;background:var(--amber)}.top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}.button,.text-button{border:1px solid transparent;border-radius:5px;font-weight:700;text-decoration:none}.button{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 11px;background:var(--blue);color:#fff}.button:hover{background:#174fa9}.button.secondary{border-color:var(--line);background:#fff;color:var(--ink)}.button.secondary:hover{border-color:#91a4b7;background:#f8fafc}.button.compact{min-height:30px;padding:4px 8px;font-size:12px}.top-doc{display:flex;align-items:center;gap:8px;min-width:0}.doc-state{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
    .workspace{display:grid;grid-template-columns:260px minmax(520px,1fr) 296px;min-height:calc(100vh - 60px)}.asset-pane,.inspector{background:var(--surface)}.asset-pane{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.pane-head{min-height:60px;padding:12px 14px;border-bottom:1px solid var(--line)}.pane-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.pane-title h1,.pane-title h2{margin:0;font-size:14px}.pane-title small{color:var(--muted);font-size:11px}.count{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 7px;border:1px solid #bfd4f5;border-radius:14px;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700}.asset-tools{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:7px;margin-top:10px}.asset-tools input{min-width:0;height:36px;padding:0 9px;border:1px solid var(--line);border-radius:5px}.upload-add{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:5px;background:var(--blue);color:#fff;font-size:23px;line-height:1}.upload-add:hover{background:#174fa9}.upload-add input{display:none}.asset-list{padding:10px;overflow:auto;max-height:calc(100vh - 120px)}.asset-item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:9px;min-height:74px;margin-bottom:8px;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:grab;transition:border .15s ease,box-shadow .15s ease,background .15s ease}.asset-item:hover,.asset-item.selected{border-color:var(--blue);background:#f8fbff;box-shadow:0 2px 8px rgba(29,94,200,.1)}.asset-item:active{cursor:grabbing}.asset-image{width:58px;height:58px;border-radius:4px;object-fit:cover;background:#e9eef3}.asset-copy{min-width:0}.asset-copy b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.asset-copy span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.asset-use{display:flex;align-items:center;gap:5px;margin-top:5px}.asset-use i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted)}.asset-use.used i{background:var(--green)}.empty{padding:28px 12px;color:var(--muted);font-size:12px;text-align:center}.asset-item.dragging{opacity:.4}
    .flow-pane{min-width:0}.flow-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}.flow-head h2{margin:0;font-size:14px}.flow-head small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.flow-summary{color:var(--muted);font-size:11px;white-space:nowrap}.flow-summary b{color:var(--blue)}.flow-canvas{min-height:calc(100vh - 120px);padding:26px 24px;overflow:auto}.flow-rail{display:flex;align-items:flex-start;min-width:max-content;padding:0 0 28px}.process-wrap{display:flex;align-items:center}.process-arrow{position:relative;flex:0 0 32px;width:32px;height:220px}.process-arrow:before{content:"";position:absolute;left:4px;right:5px;top:104px;border-top:2px solid #aab9c7}.process-arrow:after{content:"";position:absolute;right:4px;top:99px;width:8px;height:8px;border-top:2px solid #aab9c7;border-right:2px solid #aab9c7;transform:rotate(45deg)}.process-card{width:190px;min-height:220px;border:1px solid #c8d3df;border-radius:7px;background:#fff;box-shadow:0 2px 8px rgba(35,59,84,.05);overflow:hidden;transition:border .15s ease,box-shadow .15s ease,background .15s ease}.process-card.active{border:2px solid var(--blue);box-shadow:0 3px 12px rgba(29,94,200,.16)}.process-card.drop-target{border:2px dashed var(--blue);background:var(--blue-soft)}.process-card-head{min-height:76px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.process-card-head:hover{background:#f8fbff}.process-code{color:var(--blue);font:700 11px/1.2 ui-monospace,Consolas,monospace}.process-name{display:block;margin-top:5px;font-size:13px;line-height:1.35}.process-state{display:flex;align-items:center;gap:5px;margin-top:8px;color:var(--amber);font-size:10px}.process-state i{width:6px;height:6px;border-radius:50%;background:var(--amber)}.bindings{min-height:106px;padding:9px}.binding-card{position:relative;display:flex;align-items:center;gap:7px;min-height:52px;margin-bottom:7px;padding:5px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:grab}.binding-card:last-child{margin-bottom:0}.binding-card.dragging{opacity:.36}.binding-card.drop-replace{border:2px dashed var(--blue);background:var(--blue-soft)}.binding-card img{width:42px;height:42px;border-radius:3px;object-fit:cover;background:#e9eef3}.binding-card b{display:block;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.binding-card span{display:block;margin-top:3px;font-size:9px}.binding-card .confirmed{color:var(--green)}.binding-card .draft{color:var(--amber)}.drop-hint{display:grid;place-items:center;min-height:82px;color:#6f7f90;font-size:11px;text-align:center}.process-foot{display:flex;align-items:center;justify-content:space-between;min-height:35px;padding:7px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.process-foot b{color:var(--blue)}
    .inspector-empty{padding:28px 16px;color:var(--muted);font-size:12px}.inspector-step{padding:11px 14px;border-bottom:1px solid var(--line)}.inspector-step b{display:block;font-size:13px}.inspector-step small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.notice{margin:12px;padding:9px 10px;border:1px solid #efd28d;border-radius:5px;background:var(--amber-soft);color:#875607;font-size:11px}.notice strong{font-weight:700}.binding-list{padding:0 12px 14px}.bound-row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:9px;margin-top:9px;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff}.bound-row img{width:58px;height:58px;border-radius:4px;object-fit:cover;background:#e9eef3}.bound-copy{min-width:0}.bound-copy b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.bound-copy span{display:block;margin-top:3px;font-size:10px}.bound-actions{display:flex;gap:6px;margin-top:6px}.mini{min-height:27px;padding:3px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:10px;font-weight:700}.mini.confirm{border-color:#b5d8c5;background:var(--green-soft);color:var(--green)}.mini.unlink{border-color:#f0c4c1;background:var(--red-soft);color:var(--red)}.doc-box{margin:12px;padding:10px;border:1px solid var(--line);border-radius:6px;background:#f8fafc}.doc-box b{display:block;font-size:11px}.doc-box span{display:block;margin:3px 0 8px;color:var(--muted);font-size:10px}.doc-box a{font-size:11px}
    .bound-row{grid-template-columns:18px 58px minmax(0,1fr);transition:border .15s ease,background .15s ease,opacity .15s ease}.bound-row.drop-reorder{border:2px dashed var(--blue);background:var(--blue-soft)}.bound-row.drag-source{opacity:.45}.drag-handle{position:relative;align-self:stretch;width:18px;border:0;background:transparent;cursor:grab}.drag-handle:disabled{cursor:not-allowed}.drag-handle:before,.drag-handle:after{position:absolute;top:21px;width:3px;height:3px;border-radius:50%;background:#8292a2;content:"";box-shadow:0 6px #8292a2,0 12px #8292a2}.drag-handle:before{left:4px}.drag-handle:after{left:10px}.drag-handle:active{cursor:grabbing}.mini.move,.mini.confirm,.mini.unlink{min-width:27px;padding:3px 5px;font-size:14px;line-height:1}.mini.move{color:#40566c}.mini.move:hover:not(:disabled){border-color:#91a4b7;background:#f4f8fc}.toast{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:10px;max-width:min(450px,calc(100vw - 36px));padding:11px 13px;border:1px solid #455565;border-radius:6px;background:#1f2c38;color:#fff;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}.toast.show{opacity:1;transform:none}.toast.error{background:#8e302d}.toast .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.42);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1120px){.workspace{grid-template-columns:230px minmax(460px,1fr) 260px}.topbar{gap:11px}.brand{min-width:165px}.route-select{min-width:190px}.process-card{width:174px}}@media(max-width:880px){.topbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 12px}.brand{min-width:0}.route-select{flex:1;min-width:170px}.top-actions{margin-left:0}.workspace{display:block}.asset-pane,.inspector{border:0;border-bottom:1px solid var(--line)}.asset-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:290px}.asset-item{margin:0}.flow-canvas{min-height:auto;padding:22px 16px}.inspector{padding-bottom:1px}}@media(max-width:560px){.brand-copy small,.top-status{display:none}.topbar{gap:8px}.route-select{order:3;width:100%;flex-basis:100%}.top-doc{margin-left:auto}.doc-state{display:none}.asset-list{grid-template-columns:1fr}.flow-canvas{padding:18px 12px}.process-card{width:170px}.process-arrow{flex-basis:24px;width:24px}.process-arrow:before{left:2px;right:3px}.process-arrow:after{right:2px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">SOP</div><div class="brand-copy"><b>工序图片编排</b><small>仅人工确认的图片进入 DOCX 草稿</small></div></div>
    <select id="routeSelect" class="route-select" aria-label="当前产品路线"></select>
    <span class="top-status"><i></i><span id="routeStatus">读取路线中</span></span>
    <div class="top-actions"><div class="top-doc"><span id="docState" class="doc-state">读取最新 DOCX</span><a id="docDownload" class="button compact secondary" href="#" hidden>下载 DOCX</a></div><a id="backToWorkbench" class="button compact secondary" href="/workbench">返回校核台</a></div>
  </header>
  <main class="workspace">
    <aside class="asset-pane" aria-label="路线素材">
      <div class="pane-head"><div class="pane-title"><div><h1>路线素材</h1><small>当前路线的图片文件</small></div><span id="assetCount" class="count">0 张</span></div><div class="asset-tools"><input id="assetSearch" type="search" placeholder="搜索图片名称"><label class="upload-add" title="上传 PNG 或 JPEG">+<input id="assetUpload" type="file" accept="image/png,image/jpeg" multiple aria-label="上传项目图片"></label></div></div>
      <div id="assetList" class="asset-list"><div class="empty">正在读取图片素材</div></div>
    </aside>
    <section class="flow-pane" aria-labelledby="flowTitle">
      <div class="flow-head"><div><h2 id="flowTitle">完整工序图</h2><small>拖放图片到工序；点击已选图片后再点工序也可绑定。</small></div><div id="flowSummary" class="flow-summary">读取中</div></div>
      <div class="flow-canvas"><div id="flowRail" class="flow-rail"><div class="empty">正在读取工序</div></div></div>
    </section>
    <aside class="inspector" aria-label="当前工序图片">
      <div class="pane-head"><div class="pane-title"><div><h2 id="inspectorTitle">当前工序</h2><small id="inspectorSubtitle">选择中间工序查看图片</small></div><span id="bindingCount" class="count">0 / 6</span></div></div>
      <div id="inspectorBody"><div class="inspector-empty">尚未选择工序</div></div>
      <div class="doc-box"><b>文档同步</b><span id="docDetail">每次有效图片变更后自动重建 DOCX 与预览。</span><a id="docPreview" href="#" target="_blank" hidden>打开最新预览</a></div>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastSpinner" class="spinner" hidden></span><span id="toastText"></span></div>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const params=new URLSearchParams(location.search);
    const state={route:null,assets:[],bindings:[],selectedStepId:null,selectedAssetId:null,document:null,busy:false,worker:params.get('worker')||'web_reviewer',drag:null};
    let toastTimer=0;

    async function api(path,options={}){const response=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const type=response.headers.get('content-type')||'';const payload=type.includes('application/json')?await response.json():null;if(!response.ok)throw Error(payload?.detail||`请求失败（${response.status}）`);return payload}
    function worker(){return state.worker.trim()||'web_reviewer'}
    function setBusy(value){state.busy=value;document.body.setAttribute('aria-busy',String(value));$('toastSpinner').hidden=!value}
    function toast(text,error=false,busy=false){clearTimeout(toastTimer);$('toastText').textContent=text;$('toast').className=`toast${error?' error':''} show`;$('toastSpinner').hidden=!busy;if(!busy)toastTimer=setTimeout(()=>$('toast').classList.remove('show'),4600)}
    function documentMessage(result){if(result.document_status==='generation_failed')return '图片关系已保存，但 DOCX 生成失败，请稍后重试。';if(result.document_status==='preview_failed')return 'DOCX 已重新生成，预览更新失败；可继续下载 DOCX。';return result.changed===false?'图片关系未变化，未重复生成 DOCX。':'DOCX 已重新生成，预览和下载已切换到最新版本。'}
    function updateDocument(document){if(!document)return;state.document=document;const failed=document.preview_status==='failed';$('docState').textContent=failed?'DOCX 已生成，预览待修复':`DOCX v${document.version_token||'最新'} · ${document.page_count||0} 页`;$('docDetail').textContent=failed?(document.preview_error||'DOCX 已生成，预览转换暂不可用。'):`版本指纹 ${document.version_token||'最新'} · ${document.page_count||0} 页 · 已确认图片 ${document.media_count||0} 张`;$('docDownload').hidden=!document.docx_url;$('docDownload').href=document.docx_url||'#';$('docPreview').hidden=!document.preview_url;$('docPreview').href=document.preview_url||'#'}
    async function boot(){try{setBusy(true);const products=await api('/api/products');$('routeSelect').innerHTML=products.map(item=>`<option value="${item.latest_route_id}">${esc(item.product_code)} · ${esc(item.product_name)}</option>`).join('')||'<option value="">没有路线</option>';const requested=Number(params.get('route'));const routeId=products.some(item=>item.latest_route_id===requested)?requested:products[0]?.latest_route_id;if(routeId)await loadRoute(routeId);else toast('当前没有可调整图片的路线。',true)}catch(error){toast(error.message,true)}finally{setBusy(false)}}
    async function loadRoute(routeId,{preserve=true,withDocument=true}={}){const payload=await api(`/api/routes/${routeId}`);state.route=payload;state.assets=payload.media_assets||[];state.bindings=(payload.media||[]).map(item=>({...item}));if(!preserve||!payload.steps.some(step=>step.id===state.selectedStepId))state.selectedStepId=payload.steps[0]?.id||null;if(!state.assets.some(asset=>asset.id===state.selectedAssetId))state.selectedAssetId=null;$('routeSelect').value=String(payload.route.id);$('routeStatus').textContent=`${payload.route.status==='approved'?'已批准，只读':'草稿待核对'} · ${payload.steps.length} 道工序`;$('backToWorkbench').href=`/workbench?route=${encodeURIComponent(payload.route.id)}`;render();if(withDocument){try{updateDocument(await api(`/api/routes/${payload.route.id}/documents/latest`))}catch(error){$('docState').textContent='DOCX 状态读取失败';$('docDetail').textContent=error.message}}}
    function selectedStep(){return state.route?.steps.find(step=>step.id===state.selectedStepId)||null}
    function bindingsFor(stepId){return state.bindings.filter(item=>item.route_step_id===stepId)}
    function assetFor(assetId){return state.assets.find(item=>item.id===assetId)}
    function render(){renderAssets();renderFlow();renderInspector();renderInspectorOrderControls();compactInspectorActionLabels()}
    function renderAssets(){const search=$('assetSearch').value.trim().toLowerCase();const filtered=state.assets.filter(item=>!search||item.original_name.toLowerCase().includes(search));$('assetCount').textContent=`${state.assets.length} 张`;$('assetList').innerHTML=filtered.length?filtered.map(asset=>{const useCount=state.bindings.filter(item=>item.asset_id===asset.id).length;return `<article class="asset-item ${state.selectedAssetId===asset.id?'selected':''}" draggable="true" data-asset="${asset.id}" tabindex="0"><img class="asset-image" src="/api/media/${asset.id}" alt="${esc(asset.original_name)}"><div class="asset-copy"><b title="${esc(asset.original_name)}">${esc(asset.original_name)}</b><span>${esc(asset.source_note||'项目素材')}</span><span class="asset-use ${useCount?'used':''}"><i></i>${useCount?`已绑定 ${useCount} 处`:'未绑定'}</span></div></article>`}).join(''):'<div class="empty">没有匹配的项目图片</div>';document.querySelectorAll('[data-asset]').forEach(item=>{item.addEventListener('click',()=>{state.selectedAssetId=Number(item.dataset.asset);renderAssets();toast('已选中图片，点击工序或拖放到工序即可绑定。')});item.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();item.click()}});item.addEventListener('dragstart',event=>startDrag(event,{kind:'asset',assetId:Number(item.dataset.asset)}));item.addEventListener('dragend',clearDrag)})}
    function renderFlow(){const steps=state.route?.steps||[];const confirmed=state.bindings.filter(item=>item.link_state==='confirmed').length;$('flowSummary').innerHTML=`<b>${state.bindings.length}</b> 张已绑定 · <b>${confirmed}</b> 张已确认`;$('flowRail').innerHTML=steps.length?steps.map((step,index)=>`<div class="process-wrap">${index?'<div class="process-arrow" aria-hidden="true"></div>':''}<article class="process-card ${step.id===state.selectedStepId?'active':''}" data-step="${step.id}" tabindex="0"><div class="process-card-head"><span class="process-code">${String(index+1).padStart(2,'0')} · ${esc(step.step_code)}</span><b class="process-name">${esc(step.title)}</b><span class="process-state"><i></i>${step.review_state==='confirmed'?'工序已确认':'图片待人工核对'}</span></div><div class="bindings">${renderStepBindings(step.id)}</div><div class="process-foot"><span>${bindingsFor(step.id).length} / 6 张图片</span><b>${step.id===state.selectedStepId?'当前工序':''}</b></div></article></div>`).join(''):'<div class="empty">当前路线没有工序</div>';document.querySelectorAll('[data-step]').forEach(card=>{card.addEventListener('click',event=>{if(event.target.closest('.binding-card'))return;const stepId=Number(card.dataset.step);if(state.selectedAssetId){bindAsset(stepId,state.selectedAssetId);return}state.selectedStepId=stepId;renderFlow();renderInspector()});card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();card.click()}});card.addEventListener('dragover',event=>{if(state.drag){event.preventDefault();card.classList.add('drop-target')}});card.addEventListener('dragleave',event=>{if(!card.contains(event.relatedTarget))card.classList.remove('drop-target')});card.addEventListener('drop',event=>{event.preventDefault();card.classList.remove('drop-target');handleStepDrop(Number(card.dataset.step),event)})})}
    function renderStepBindings(stepId){const bindings=bindingsFor(stepId);if(!bindings.length)return '<div class="drop-hint">拖入图片<br>或先在左侧选中图片</div>';return bindings.map(binding=>{const asset=assetFor(binding.asset_id);return `<div class="binding-card" draggable="true" data-link="${binding.link_id}" data-step="${stepId}"><img src="/api/media/${binding.asset_id}" alt="${esc(asset?.original_name||'图片')}"><div><b>${esc(asset?.original_name||'图片')}</b><span class="${binding.link_state==='confirmed'?'confirmed':'draft'}">${binding.link_state==='confirmed'?'已人工确认':'待人工确认'}</span></div></div>`}).join('')}
    function bindBindingInteractions(){document.querySelectorAll('[data-link]').forEach(card=>{const linkId=Number(card.dataset.link),stepId=Number(card.dataset.step);card.addEventListener('click',event=>{event.stopPropagation();state.selectedStepId=stepId;renderFlow();renderInspector()});card.addEventListener('dragstart',event=>startDrag(event,{kind:'binding',linkId,stepId,assetId:state.bindings.find(item=>item.link_id===linkId)?.asset_id}));card.addEventListener('dragend',clearDrag);card.addEventListener('dragover',event=>{if(!state.drag)return;event.preventDefault();event.stopPropagation();card.classList.add('drop-replace')});card.addEventListener('dragleave',()=>card.classList.remove('drop-replace'));card.addEventListener('drop',event=>{event.preventDefault();event.stopPropagation();card.classList.remove('drop-replace');handleBindingDrop(stepId,linkId)})})}
    function renderInspector(){const step=selectedStep();$('inspectorTitle').textContent=step?`${step.step_code} · ${step.title}`:'当前工序';$('inspectorSubtitle').textContent=step?'当前工序图片':'选择中间工序查看图片';const bindings=step?bindingsFor(step.id):[];$('bindingCount').textContent=`${bindings.length} / 6`;$('inspectorBody').innerHTML=step?`<div class="inspector-step"><b>${esc(step.title)}</b><small>图片变更会保持草稿状态；请逐张确认需要进入 DOCX 的图片。</small></div><div class="notice"><strong>审核边界：</strong>只有“已人工确认”的图片会出现在正式指导书图片区。</div><div class="binding-list">${bindings.length?bindings.map((binding,index)=>{const asset=assetFor(binding.asset_id);return `<article class="bound-row"><img src="/api/media/${binding.asset_id}" alt="${esc(asset?.original_name||'图片')}"><div class="bound-copy"><b>${index+1}. ${esc(asset?.original_name||'图片')}</b><span class="${binding.link_state==='confirmed'?'confirmed':'draft'}">${binding.link_state==='confirmed'?'已人工确认':'待人工确认'}</span><div class="bound-actions">${binding.link_state==='confirmed'?'':`<button class="mini confirm" type="button" data-confirm-link="${binding.link_id}">确认图片</button>`}<button class="mini unlink" type="button" data-unlink-link="${binding.link_id}">解除</button></div></div></article>`}).join(''):'<div class="inspector-empty">当前工序尚未绑定图片。</div>'}</div>`:'<div class="inspector-empty">尚未选择工序</div>';document.querySelectorAll('[data-confirm-link]').forEach(button=>button.addEventListener('click',()=>confirmLink(Number(button.dataset.confirmLink))));document.querySelectorAll('[data-unlink-link]').forEach(button=>button.addEventListener('click',()=>unlinkLink(Number(button.dataset.unlinkLink))));bindBindingInteractions()}
    function compactInspectorActionLabels(){document.querySelectorAll('[data-confirm-link]').forEach(button=>{button.innerHTML='&#10003;';button.title='确认图片';button.setAttribute('aria-label','确认图片')});document.querySelectorAll('[data-unlink-link]').forEach(button=>{button.innerHTML='&#215;';button.title='解除图片';button.setAttribute('aria-label','解除图片')})}
    function renderInspectorOrderControls(){const step=selectedStep(),rows=[...document.querySelectorAll('.bound-row')],locked=state.route?.route.status==='approved';if(!step||!rows.length)return;const hint=document.querySelector('.inspector-step small');if(hint&&rows.length>1)hint.textContent='图片将按此处顺序写入 DOCX。拖动左侧把手或使用上下箭头可调整，确认状态会保留。';rows.forEach((row,index)=>{const action=row.querySelector('[data-confirm-link],[data-unlink-link]'),linkId=Number(action?.dataset.confirmLink||action?.dataset.unlinkLink),binding=state.bindings.find(item=>item.link_id===linkId);if(!action||!binding)return;row.insertAdjacentHTML('afterbegin',`<button class="drag-handle" type="button" draggable="${locked?'false':'true'}" data-drag-link="${linkId}" title="拖动调整图片顺序" aria-label="拖动第 ${index+1} 张图片调整顺序" ${locked?'disabled':''}></button>`);const actions=row.querySelector('.bound-actions');actions.insertAdjacentHTML('afterbegin',`<button class="mini move" type="button" data-move-link="${linkId}" data-direction="-1" title="上移" aria-label="上移第 ${index+1} 张图片" ${locked||index===0?'disabled':''}>&#8593;</button><button class="mini move" type="button" data-move-link="${linkId}" data-direction="1" title="下移" aria-label="下移第 ${index+1} 张图片" ${locked||index===rows.length-1?'disabled':''}>&#8595;</button>`);row.addEventListener('dragover',event=>{const payload=state.drag||readDrag(event);if(locked||!payload||payload.kind!=='binding'||payload.stepId!==step.id||payload.linkId===linkId)return;event.preventDefault();row.classList.add('drop-reorder')});row.addEventListener('dragleave',()=>row.classList.remove('drop-reorder'));row.addEventListener('drop',event=>{const payload=state.drag||readDrag(event);if(!payload||payload.kind!=='binding'||payload.stepId!==step.id||payload.linkId===linkId)return;event.preventDefault();const rect=row.getBoundingClientRect();reorderBinding(payload.linkId,linkId,event.clientY>rect.top+rect.height/2);row.classList.remove('drop-reorder');clearDrag()})});document.querySelectorAll('[data-drag-link]').forEach(handle=>{const linkId=Number(handle.dataset.dragLink),binding=state.bindings.find(item=>item.link_id===linkId);handle.addEventListener('dragstart',event=>{if(!binding)return;startDrag(event,{kind:'binding',linkId,stepId:binding.route_step_id,assetId:binding.asset_id});handle.closest('.bound-row')?.classList.add('drag-source')});handle.addEventListener('dragend',event=>{handle.closest('.bound-row')?.classList.remove('drag-source');clearDrag(event)})});document.querySelectorAll('[data-move-link]').forEach(button=>button.addEventListener('click',()=>moveBinding(Number(button.dataset.moveLink),Number(button.dataset.direction))))}
    function reorderBinding(sourceLinkId,targetLinkId,after=false){if(sourceLinkId===targetLinkId)return;const sourceIndex=state.bindings.findIndex(item=>item.link_id===sourceLinkId),targetIndex=state.bindings.findIndex(item=>item.link_id===targetLinkId);if(sourceIndex<0||targetIndex<0)return;const source=state.bindings[sourceIndex],target=state.bindings[targetIndex];if(source.route_step_id!==target.route_step_id)return;mutateLayout(()=>{state.bindings.splice(sourceIndex,1);const revisedTarget=state.bindings.findIndex(item=>item.link_id===targetLinkId);state.bindings.splice(revisedTarget+(after?1:0),0,source)},'已调整图片顺序。')}
    function moveBinding(linkId,direction){const binding=state.bindings.find(item=>item.link_id===linkId);if(!binding||!direction)return;const siblings=bindingsFor(binding.route_step_id),sourceIndex=siblings.findIndex(item=>item.link_id===linkId),target=siblings[sourceIndex+direction];if(!target)return;reorderBinding(linkId,target.link_id,direction>0)}
    function startDrag(event,payload){if(state.busy){event.preventDefault();return}state.drag=payload;event.dataTransfer.effectAllowed=payload.kind==='asset'?'copy':'copyMove';event.dataTransfer.setData('text/plain',JSON.stringify(payload));event.currentTarget.classList.add('dragging')}
    function clearDrag(event){event?.currentTarget?.classList.remove('dragging');state.drag=null;document.querySelectorAll('.drop-target,.drop-replace').forEach(item=>item.classList.remove('drop-target','drop-replace'))}
    function handleStepDrop(stepId,event){const payload=state.drag||readDrag(event);if(!payload)return;if(payload.kind==='asset')bindAsset(stepId,payload.assetId);else if(payload.kind==='binding')bindAsset(stepId,payload.assetId);clearDrag()}
    function handleBindingDrop(targetStepId,targetLinkId){const payload=state.drag;if(!payload)return;if(payload.kind==='binding'&&payload.stepId===targetStepId){reorderBinding(payload.linkId,targetLinkId)}else if(payload.assetId){replaceBinding(targetLinkId,payload.assetId)}clearDrag()}
    function readDrag(event){try{return JSON.parse(event.dataTransfer.getData('text/plain'))}catch{return null}}
    function bindAsset(stepId,assetId){const existing=bindingsFor(stepId);const asset=assetFor(assetId);if(!asset)return;if(existing.length>=6)return toast('每道工序最多绑定 6 张图片。',true);if(existing.some(item=>item.asset_id===assetId))return toast('该图片已经绑定到当前工序。',true);mutateLayout(()=>{state.bindings.push({route_step_id:stepId,asset_id:assetId,caption:asset.original_name,link_state:'draft',link_id:`new-${Date.now()}-${assetId}`});state.selectedStepId=stepId},`已绑定“${asset.original_name}”`)}
    function replaceBinding(linkId,assetId){const target=state.bindings.find(item=>item.link_id===linkId),asset=assetFor(assetId);if(!target||!asset)return;if(state.bindings.some(item=>item.route_step_id===target.route_step_id&&item.asset_id===assetId&&item.link_id!==linkId))return toast('该图片已经绑定到当前工序。',true);mutateLayout(()=>{target.asset_id=assetId;target.caption=asset.original_name;target.link_state='draft'},`已替换为“${asset.original_name}”，需要人工确认。`)}
    function unlinkLink(linkId){const binding=state.bindings.find(item=>item.link_id===linkId),asset=assetFor(binding?.asset_id);if(!binding)return;mutateLayout(()=>{state.bindings=state.bindings.filter(item=>item.link_id!==linkId)},`已解除“${asset?.original_name||'图片'}”。`)}
    async function mutateLayout(mutator,successText){if(state.busy)return;const previous=state.bindings.map(item=>({...item}));mutator();render();try{setBusy(true);toast('正在保存图片关系并重建 DOCX...',false,true);const result=await api(`/api/routes/${state.route.route.id}/media/bindings`,{method:'POST',body:JSON.stringify({bindings:state.bindings.map(item=>({step_id:item.route_step_id,asset_id:item.asset_id,caption:item.caption||''})),reviewer:worker()})});updateDocument(result.document);await loadRoute(state.route.route.id,{withDocument:false});toast(`${successText}${documentMessage(result)}`)}catch(error){state.bindings=previous;render();toast(error.message,true)}finally{setBusy(false)}}
    async function confirmLink(linkId){if(state.busy)return;try{setBusy(true);toast('正在确认图片并更新 DOCX...',false,true);const result=await api(`/api/media/links/${linkId}/confirm`,{method:'POST',body:JSON.stringify({reviewer:worker()})});updateDocument(result.document);await loadRoute(state.route.route.id,{withDocument:false});toast(documentMessage(result))}catch(error){toast(error.message,true)}finally{setBusy(false)}}
    async function uploadAssets(event){const files=[...event.target.files];if(!files.length)return;try{setBusy(true);for(const file of files){if(!/^image\/(png|jpeg)$/.test(file.type))throw Error(`${file.name} 不是 PNG 或 JPEG 图片。`);if(file.size>10*1024*1024)throw Error(`${file.name} 超过 10MB。`);const data=await fileBase64(file);await api(`/api/routes/${state.route.route.id}/media`,{method:'POST',body:JSON.stringify({original_name:file.name,mime_type:file.type,data_base64:data,uploaded_by:worker(),source_note:'项目图片统一调整页面上传'})})}await loadRoute(state.route.route.id,{withDocument:false});toast(`已添加 ${files.length} 张项目图片，可拖到对应工序。`)}catch(error){toast(error.message,true)}finally{event.target.value='';setBusy(false)}}
    function fileBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)})}
    $('routeSelect').addEventListener('change',event=>loadRoute(Number(event.target.value),{preserve:false}));$('assetSearch').addEventListener('input',renderAssets);$('assetUpload').addEventListener('change',uploadAssets);boot();
  </script>
</body>
